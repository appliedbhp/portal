<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow,noarchive">
<title>Guest Assessment — Applied Behavioral Health Practice</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
<link rel="stylesheet" href="css/style.css">
<style>
body{margin:0;background:radial-gradient(circle at 15% 0,rgba(49,133,252,.15),transparent 32%),linear-gradient(145deg,#f7f9ff,#eef7ff);color:#172033}.ga-shell{width:min(920px,calc(100% - 28px));margin:28px auto 70px}.ga-brand{display:flex;align-items:center;justify-content:space-between;gap:16px;margin-bottom:18px;padding:18px 22px;border-radius:20px;background:linear-gradient(125deg,#283a8f,#3185fc 58%,#06b6d4);color:#fff;box-shadow:0 18px 45px rgba(43,77,163,.22)}.ga-brand img{width:180px;max-width:45%}.ga-brand span{font-size:12px;opacity:.84}.ga-card{margin-bottom:14px;padding:22px;border:1px solid rgba(148,163,184,.3);border-radius:18px;background:rgba(255,255,255,.95);box-shadow:0 10px 30px rgba(44,67,120,.09)}.ga-card h1{margin:0 0 7px;font-size:26px}.ga-card h2{margin:0 0 12px}.ga-muted{color:#64748b;font-size:13px}.ga-code{display:grid;grid-template-columns:1fr auto;gap:10px;max-width:480px}.ga-code input{text-transform:uppercase;letter-spacing:.14em;font-weight:800}.ga-meta{display:flex;flex-wrap:wrap;gap:8px;margin-top:14px}.ga-meta span{padding:5px 9px;border-radius:99px;background:#eef2ff;color:#4338ca;font-size:11px;font-weight:750}.ga-question{padding:15px 0;border-bottom:1px solid #e5e7eb}.ga-question p{margin:0 0 11px;line-height:1.5;font-size:14px}.ga-options{display:flex;flex-wrap:wrap;gap:7px}.ga-options label{display:flex;align-items:center;gap:5px;margin:0;padding:7px 9px;border:1px solid #dbe2ef;border-radius:9px;background:#fafcff;cursor:pointer;font-size:11px;text-transform:none;letter-spacing:0}.ga-options label:has(input:checked){border-color:#3185fc;background:#eff6ff;color:#1d4ed8}.ga-options input{width:17px;height:17px}.ga-section{margin-top:24px;padding:9px 12px;border-radius:10px;background:linear-gradient(90deg,#eef2ff,#effcff);color:#3730a3}.ga-domain{margin-top:28px;color:#1e3a8a}.ga-submit{display:flex;align-items:center;justify-content:space-between;gap:14px;margin-top:22px}.ga-success{text-align:center;padding:48px 24px}.ga-success i{font-size:52px;color:#059669}.ga-error{padding:12px 14px;border-radius:10px;background:#fff1f2;color:#be123c;font-size:13px}.ga-loading{text-align:center;padding:44px;color:#64748b}.ga-loading i{display:block;margin-bottom:12px;font-size:30px;color:#3185fc;animation:spin 1s linear infinite}@keyframes spin{to{transform:rotate(360deg)}}@media(max-width:600px){.ga-shell{width:min(100% - 18px,920px);margin-top:9px}.ga-brand,.ga-card{border-radius:14px;padding:17px}.ga-brand span{display:none}.ga-code{grid-template-columns:1fr}.ga-options label{flex:1 1 44%;justify-content:flex-start}.ga-submit{align-items:stretch;flex-direction:column}}
</style>
</head>
<body>
<main class="ga-shell">
  <header class="ga-brand"><img src="https://d1yei2z3i6k35z.cloudfront.net/15694166/695009dabcbb1_LogoWhite.png" alt="Applied Behavioral Health Practice"><span>Secure guest assessment</span></header>
  <div id="ga-root"><div class="ga-card ga-loading"><i class="bi bi-arrow-repeat"></i>Opening your invitation…</div></div>
</main>
<script>
const API_URL="https://script.google.com/macros/s/AKfycbwtKb9UqSeBy4FKiI-VZK2EOpwm2ZCe8eWMgnAF0WkZB5FgBOEpjicvFDG59Dlft61i/exec";
const SCHOOL_DOMAINS=[{name:"Executive Function",sections:["A","B","C","D"],subs:["Planning and Prioritizing","Initiating and Persisting","Follow Through and Wrapping Up","Organization"]},{name:"Emotional Regulation",sections:["E","F","G","H"],subs:["Problem Solving","Self-Encouragement","Self-Management","Repair and Recovery"]},{name:"Life and Classroom Skills",sections:["I","J","K","L"],subs:["Money Management","Relationship Management","Time and Project Management","Routines and Goal-Directed Persistence"]},{name:"Social Skills",sections:["M","N","O","P"],subs:["Rejection Sensitivity","Peer Pressure","Speaker","Listener"]}];
let credential={},invite=null,items=[];
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
async function call(action,params={}){const response=await fetch(API_URL,{method:"POST",headers:{"Content-Type":"text/plain;charset=utf-8"},body:JSON.stringify({action,...params})});const data=await response.json();if(!data.ok)throw new Error(data.error||"Request failed");return data;}
function codeEntry(message=""){document.getElementById("ga-root").innerHTML=`<section class="ga-card"><h1>Open a guest assessment</h1><p class="ga-muted">Enter the access code from your invitation. You do not need a client portal account.</p>${message?`<div class="ga-error">${esc(message)}</div>`:""}<div class="ga-code"><input id="ga-code" maxlength="14" autocomplete="one-time-code" placeholder="ACCESS CODE"><button onclick="openCode()"><i class="bi bi-unlock-fill"></i> Continue</button></div></section><section class="ga-card"><strong><i class="bi bi-shield-lock-fill"></i> Limited access</strong><p class="ga-muted">This invitation opens only the assigned assessment and does not provide access to client records, notes, goals, or the portal.</p></section>`;}
async function openCode(){const code=document.getElementById("ga-code").value.trim();if(!code)return;credential={code};sessionStorage.setItem("guestAssessmentCredential",JSON.stringify(credential));await loadInvite();}
async function loadInvite(){document.getElementById("ga-root").innerHTML='<div class="ga-card ga-loading"><i class="bi bi-arrow-repeat"></i>Validating invitation…</div>';try{const data=await call("getGuestAssessmentInvite",credential);invite=data.invite;history.replaceState({},"",location.pathname);await renderInvite();}catch(e){codeEntry(e.message);}}
async function renderInvite(){if(invite.assessmentType==="roadmap")await loadRoadmap();document.getElementById("ga-root").innerHTML=`<section class="ga-card"><h1>${esc(invite.assessmentName)}</h1><p class="ga-muted">Please answer based on your observations. Your responses will be shared with the care team for the client connected to this invitation.</p><div class="ga-meta"><span><i class="bi bi-person-fill"></i> ${esc(invite.relationship)}</span><span><i class="bi bi-clock-fill"></i> Single submission</span><span><i class="bi bi-calendar-x"></i> Expires ${new Date(invite.expiresAt).toLocaleDateString()}</span></div><label style="display:block;margin-top:18px">Your name<input id="ga-name" value="${esc(invite.recipientName)}" autocomplete="name"></label></section><form id="ga-form" class="ga-card" onsubmit="submitGuest(event)">${invite.assessmentType==="roadmap"?roadmapHtml():libraryHtml()}<div id="ga-status"></div><div class="ga-submit"><span class="ga-muted"><i class="bi bi-lock-fill"></i> This invitation can be submitted only once.</span><button type="submit"><i class="bi bi-check-circle-fill"></i> Submit assessment</button></div></form>`;}
async function loadRoadmap(){const reliability=["Preschool","Adult"].includes(invite.level),url=reliability?"assets/roadmap-v3-reliability.json":"assets/roadmap-v3-school.json";const response=await fetch(url);if(!response.ok)throw new Error("The assessment definition could not be loaded.");const defs=await response.json();if(reliability){items=(defs[invite.level]||[]).flatMap((area,ai)=>area.items.map((text,qi)=>({id:`r-${ai}-${qi}`,domain:area.name,subdomain:area.name,text})));}else{const form=defs[invite.level]||{};items=SCHOOL_DOMAINS.flatMap(group=>group.sections.flatMap((section,i)=>(form[section]||[]).map((text,qi)=>({id:`${section}-${qi}`,domain:group.name,subdomain:group.subs[i],text}))));}if(!items.length)throw new Error("This Roadmap form has no questions.");}
function roadmapHtml(){const reliability=["Preschool","Adult"].includes(invite.level),scale=reliability?["Not Yet Reliable","Reliable With Support","Reliable Independently"]:["Not Yet Observed","Emerging","Developing With Support","Established / Independent"];let lastDomain="",lastSub="";return `<h2>Assessment items</h2><p class="ga-muted">Choose the rating that best represents what you have observed. Select N/O when there has not been enough opportunity to rate a skill.</p>`+items.map((item,index)=>{let head="";if(item.domain!==lastDomain){lastDomain=item.domain;head+=`<h2 class="ga-domain">${esc(item.domain)}</h2>`;}if(item.subdomain!==lastSub){lastSub=item.subdomain;head+=`<h3 class="ga-section">${esc(item.subdomain)}</h3>`;}return head+questionHtml(index,item.text,scale,true);}).join("");}
function libraryHtml(){const def=invite.definition||{},scale=def.scale||[];return `${def.instructions?`<div class="ga-section">${esc(def.instructions)}</div>`:""}`+(def.parts||[]).map(part=>`<h3 class="ga-section">${esc(part.name||part.id)}</h3>`+(part.questions||[]).map(q=>questionHtml("q"+q.id,q.text,scale,false)).join("")).join("");}
function questionHtml(id,text,scale,allowNo){return `<div class="ga-question" id="row-${esc(id)}"><p>${esc(text)}</p><div class="ga-options">${scale.map((label,i)=>`<label><input required type="radio" name="${esc(id)}" value="${allowNo?i:esc(label)}">${allowNo?`<b>${i}</b> — `:""}${esc(label)}</label>`).join("")}${allowNo?`<label><input required type="radio" name="${esc(id)}" value="unknown">N/O</label>`:""}</div></div>`;}
function collectRoadmap(){const grouped={};items.forEach((item,index)=>{const input=document.querySelector(`input[name="${index}"]:checked`);if(!input)return;const key=item.domain+"|"+item.subdomain;if(!grouped[key])grouped[key]={domain:item.domain,subdomain:item.subdomain,scores:[]};if(input.value!=="unknown")grouped[key].scores.push(+input.value);});return Object.values(grouped).map(group=>({domain:group.domain,subdomain:group.subdomain,total:group.scores.reduce((a,b)=>a+b,0),mean:group.scores.length?Math.round(group.scores.reduce((a,b)=>a+b,0)/group.scores.length*100)/100:0}));}
function collectLibrary(){const responses={},def=invite.definition||{};(def.parts||[]).forEach(part=>(part.questions||[]).forEach(q=>{const input=document.querySelector(`input[name="q${CSS.escape(String(q.id))}"]:checked`);if(input)responses["q"+q.id]=input.value;}));return responses;}
async function submitGuest(event){event.preventDefault();const name=document.getElementById("ga-name").value.trim(),status=document.getElementById("ga-status");if(!name){status.innerHTML='<div class="ga-error">Enter your name before submitting.</div>';return;}status.innerHTML='<div class="ga-loading"><i class="bi bi-arrow-repeat"></i>Submitting securely…</div>';const payload={...credential,respondentName:name,userAgent:navigator.userAgent,timezone:Intl.DateTimeFormat().resolvedOptions().timeZone};if(invite.assessmentType==="roadmap")payload.summary=collectRoadmap();else payload.responses=collectLibrary();try{await call("submitGuestAssessment",payload);credential={};sessionStorage.removeItem("guestAssessmentCredential");document.getElementById("ga-root").innerHTML='<section class="ga-card ga-success"><i class="bi bi-check-circle-fill"></i><h1>Thank you</h1><p>Your assessment was submitted securely to the care team. This invitation can no longer be used.</p></section>';}catch(e){status.innerHTML=`<div class="ga-error">${esc(e.message)}</div>`;}}
(async()=>{const token=new URLSearchParams(location.search).get("token");let saved={};try{saved=JSON.parse(sessionStorage.getItem("guestAssessmentCredential")||"{}");}catch(_){}if(token){credential={token};sessionStorage.setItem("guestAssessmentCredential",JSON.stringify(credential));await loadInvite();}else if(saved.token||saved.code){credential=saved;await loadInvite();}else codeEntry();})();
</script>
</body>
</html>
